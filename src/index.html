      boxShadow: "var(--shadow-soft)" }}>{msg}</div>
  );
  return [show, node];
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const a = document.createElement("textarea"); a.value = text; a.style.position = "fixed"; a.style.opacity = "0";
    document.body.appendChild(a); a.select(); document.execCommand("copy"); document.body.removeChild(a);
  }
}

/* roman numerals for folios */
function roman(n) {
  const map = [["X",10],["IX",9],["V",5],["IV",4],["I",1]];
  let s = "", v = n;
  for (const [r, k] of map) while (v >= k) { s += r; v -= k; }
  return s || "·";
}

  useEffectG(() => {

      if (liveDrift.current) clearInterval(liveDrift.current);

      stopDrift();

      if (p.kind === "Cover") out.push({ type: "cover", page: p, image: p.image });
      else if (p.kind === "Story") {
        if (p.sceneIndex === 0) out.push({ type: "chapter", page: p, image: p.image });
        out.push({ type: "scene", page: p, image: p.image });
      } else out.push({ type: "decode", page: p, image: p.image });
    });
    const lastImg = out.length ? out[out.length - 1].image : (pages[0] && pages[0].image);

  }, [pages]);

  const uniqueImages = useMemoCR(() => [...new Set(sections.map((s) => s.image))], [sections]);
  const stops = useMemoCR(
    () => sections.map((s, i) => ({ i, s })).filter((x) => x.s.type === "cover" || x.s.type === "chapter"),
    [sections]
  );

  // active section = the one whose body holds the viewport "read line"
  useEffectCR(() => {
    const el = scroller.current;
    if (!el) return;
    let raf = 0;
    const onScroll = () => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        const line = el.scrollTop + el.clientHeight * 0.42;
        let best = 0, bestD = Infinity;
        nodeRefs.current.forEach((n, i) => {
          if (!n) return;
          const top = n.offsetTop, bot = top + n.offsetHeight, mid = (top + bot) / 2;
          if (line >= top && line < bot) { best = i; bestD = -1; }
          else if (bestD !== -1) { const d = Math.abs(mid - line); if (d < bestD) { bestD = d; best = i; } }
        });
        setActive((a) => (a === best ? a : best));
      });
    };
    el.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    return () => { el.removeEventListener("scroll", onScroll); cancelAnimationFrame(raf); };
  }, [sections]);

  const scrollToIndex = (i) => {
    const n = nodeRefs.current[i], el = scroller.current;
    if (!n || !el) return;
    el.scrollTo({ top: n.offsetTop, behavior: "smooth" });
  };

  useEffectCR(() => {
    const h = (e) => {
      if (e.key === "Escape") { setToc(false); return; }
      if (toc || e.defaultPrevented || e.target.closest("input, textarea, select, button, [contenteditable], [role='dialog']")) return;
      if (["ArrowDown", "ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); scrollToIndex(Math.min(active + 1, sections.length - 1)); }
      else if (["ArrowUp", "ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); scrollToIndex(Math.max(active - 1, 0)); }
      else if (e.key === "Escape") setToc(false);
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [active, sections, toc]);

  const cur = sections[active] || sections[0];
  const activeImage = cur.image;
  const mode = cur.type;
  const pan = (cur.page && cur.page.pan != null) ? cur.page.pan : 50;
  const progress = sections.length > 1 ? active / (sections.length - 1) : 0;
  const activeStop = stops.reduce((acc, x) => (x.i <= active ? x.i : acc), 0);

  return (
    <div className="cine grain" ref={scroller} lang={htmlLang(lang)}>
      {/* fixed cinematic backdrop */}
      <div className="cine-bg">
        {uniqueImages.map((src) => (
          <div key={src} className="cine-bg-layer" style={{ opacity: src === activeImage ? 1 : 0 }}>
            <img src={src} alt="" style={{ objectPosition: `${pan}% 50%` }} />
          </div>
        ))}
        <div className="cine-scrim" data-mode={mode} />
        <div className="cine-bars" />
      </div>

      {/* top bar */}
      <header className="cine-bar">
        <button className="btn btn--quiet" data-ob="shelf" onClick={onExit} style={{ flex: "0 0 auto" }}>
          <Icon name="left" size={16} /><span style={{ marginLeft: 4 }}>{T.shelf}</span>
        </button>
        <div className="cine-bar-mid">
          <p className="kicker" style={{ fontSize: 10 }}>{meta.trilogy}</p>
          <p className="cine-bar-title" style={{ fontFamily: _cjk(meta.title) ? "var(--font-cjk)" : "var(--font-display)" }}>
            {barLabel(cur, T, meta)}
          </p>
        </div>
        <div className="cine-bar-right">
          <button className="iconbtn" data-ob="contents" onClick={() => setToc((t) => !t)} aria-label="Contents" title={T.contents}><Icon name="contents" /></button>
          <LangToggle lang={lang} setLang={setLang} />
          <ThemeToggle theme={theme} setTheme={setTheme} />
        </div>
      </header>

      {/* progress rail */}
      <nav className="cine-rail" aria-label={T.contents}>
        <div className="cine-rail-track"><span className="cine-rail-fill" style={{ height: `${progress * 100}%` }} /></div>
        {stops.map(({ i, s }) => (
          <button key={i} aria-label={s.type === "cover" ? T.titlePage : s.page.title} aria-current={activeStop === i ? "step" : undefined}
            className={"cine-rail-dot" + (active >= i ? " is-done" : "") + (activeStop === i ? " is-active" : "")}
            style={{ top: `${(i / (sections.length - 1)) * 100}%` }}
            onClick={() => scrollToIndex(i)} />
        ))}
      </nav>

      {/* the flow */}
      <div className="cine-flow">
        {sections.map((s, i) => (
          <section key={i} ref={(n) => (nodeRefs.current[i] = n)}
            className={`cine-sec cine-${s.type}`}
            data-screen-label={s.type === "scene" ? `${s.page.nav}` : s.type}
            {...(active === i ? { "data-active": "" } : {})}>
            <Section s={s} T={T} meta={meta} lang={lang} onBegin={() => scrollToIndex(1)} onExit={onExit} />
          </section>
        ))}
      </div>

      {toc && <CineContents sections={sections} active={active} T={T} onPick={(i) => { scrollToIndex(i); setToc(false); }} onClose={() => setToc(false)} />}
    </div>
  );
}

function barLabel(cur, T, meta) {
  if (cur.type === "cover") return meta.title;
  if (cur.type === "end") return meta.title;
  if (cur.type === "decode") return `${cur.page.title} · ${T.decodedWord}`;
  const p = cur.page;
  return `${p.title} · ${p.sceneIndex + 1}/${p.sceneCount}`;
}

function Section({ s, T, meta, lang, onBegin, onExit }) {
  const p = s.page;
  const dispFont = (t) => (_cjk(t) ? "var(--font-cjk)" : "var(--font-display)");

  if (s.type === "cover") {
    return (
      <div className="inner">
        <p className="kicker reveal" style={{ color: "rgba(246,237,219,.7)" }}>{meta.trilogy}</p>
        <h1 className="reveal" style={{ fontFamily: dispFont(meta.title), letterSpacing: _cjk(meta.title) ? "0.03em" : undefined }}>{meta.title}</h1>
        <p className="sub reveal">{meta.subtitle}.</p>
        <button className="cine-cue reveal" onClick={onBegin} style={{ background: "none", border: 0, cursor: "pointer" }}>
          {T.begin} <Icon name="right" size={16} style={{ transform: "rotate(90deg)" }} />
        </button>
      </div>
    );
  }

  if (s.type === "chapter") {
    return (
      <div className="inner">
        <p className="num reveal">{T.ch} {roman(p.chapterIndex + 1)}</p>
        <h2 className="reveal" style={{ fontFamily: dispFont(p.title), letterSpacing: _cjk(p.title) ? "0.04em" : undefined }}>{p.title}</h2>
        <p className="deck reveal">{p.deck}</p>
      </div>
    );
  }

  if (s.type === "scene") {
    return (
      <div className="cine-panel reveal">
        <div className="cine-scene-meta">
          <span className="kicker" style={{ color: "var(--accent)" }}>{T.theFable}</span>
          <span className="kicker" style={{ textTransform: "none" }}>{T.ch} {roman(p.chapterIndex + 1)} · {p.sceneIndex + 1}/{p.sceneCount}</span>
        </div>
        <Prose raw={p.raw} drop={p.sceneIndex === 0} />
      </div>
    );
  }

  if (s.type === "decode") {
    return (
      <div className="cine-decode-card reveal">
        <div className="cine-decode-head">
          <span className="tag">{T.afterStory}</span>
          <span className="ln" />
        </div>
        <h3 className="dt" style={{ fontFamily: dispFont(p.title), letterSpacing: _cjk(p.title) ? "0.04em" : undefined }}>{p.title}</h3>
        <div style={{ height: 18 }} />
        <Prose raw={p.raw} drop={false} />
      </div>
    );
  }

  // end
  const endTitle = lang === "zh" ? "寓言完" : (lang === "da" ? "Fablen er slut" : (lang === "fr" ? "Fin de la fable" : "End of the fable"));
  return (
    <div className="cine-end inner">
      <p className="kicker reveal" style={{ color: "rgba(246,237,219,.7)", marginBottom: 18 }}>{meta.trilogy}</p>
      <h2 className="reveal">{endTitle}</h2>
      <p className="reveal">{meta.subtitle}.</p>
      <button className="btn btn--ghost reveal" data-ob="shelf" onClick={onExit} style={{ borderColor: "rgba(246,237,219,.4)", color: "#f6eddb" }}>
        <Icon name="left" size={15} /> {T.shelf}
      </button>
    </div>
  );
}

/* prose with an optional drop-initial, rendered from the shared markdown engine */
function Prose({ raw, drop }) {
  const ref = useRefCR(null);
  useEffectCR(() => {
    if (!drop || !ref.current) return;
    const p = [...ref.current.children].find((e) => e.tagName === "P");
    if (!p || p.querySelector(".dropcap")) return;
    const txt = p.firstChild;
    if (txt && txt.nodeType === 3 && txt.textContent.length) {
      const span = document.createElement("span");
      span.className = "dropcap" + (_cjk(txt.textContent[0]) ? " cjk" : "");
      span.textContent = txt.textContent[0];
      txt.textContent = txt.textContent.slice(1);
      p.insertBefore(span, txt);
    }
  }, [raw, drop]);
  const html = window.FABLE.renderMarkdown(raw || "");
  return <div className="cine-prose" ref={ref} dangerouslySetInnerHTML={{ __html: html }} />;
}

function CineContents({ sections, active, T, onPick, onClose }) {
  const dialogRef = React.useRef(null);
  React.useEffect(() => {
    const previous = document.activeElement;
    dialogRef.current?.querySelector("button")?.focus();
    return () => { if (previous?.isConnected) previous.focus(); };
  }, []);
  const trapFocus = (event) => {
    if (event.key !== "Tab") return;
    const buttons = [...dialogRef.current.querySelectorAll("button")];
    const first = buttons[0], last = buttons[buttons.length - 1];
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  };
  const rows = sections
    .map((s, i) => ({ s, i }))
    .filter((x) => ["cover", "chapter", "decode", "end"].includes(x.s.type));
  return (
    <div className="overlay" onClick={onClose}>
      <div className="overlay-card grain fade-up" ref={dialogRef} role="dialog" aria-modal="true" aria-labelledby="contents-title" onKeyDown={trapFocus} onClick={(e) => e.stopPropagation()}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 22 }}>
          <h3 id="contents-title" className="display" style={{ fontSize: 26 }}>{T.contents}</h3>
          <button className="iconbtn" onClick={onClose} aria-label="Close"><Icon name="x" /></button>
        </div>
        <div style={{ display: "grid", gap: 8 }}>
          {rows.map(({ s, i }) => {
            const p = s.page;
            const isChap = s.type === "chapter";
            const isDecode = s.type === "decode";
            const label = s.type === "cover" ? T.titlePage
              : s.type === "end" ? (T.contents && "—")
              : isDecode ? `${T.ch} ${roman(p.chapterIndex + 1)} · ${T.decodedWord}`
              : `${T.ch} ${roman(p.chapterIndex + 1)} · ${p.sceneCount} ${T.scenesWord}`;
            const title = s.type === "cover" ? sections[0].page.title
              : s.type === "end" ? (T.contents ? "Fin" : "Fin")
              : p.title;
            return (
              <button key={i}
                className={(isDecode ? "toc-sub" : "toc-row") + (active === i ? " is-active" : "")}
                style={isDecode ? {} : { gridTemplateColumns: "64px 1fr auto" }}
                onClick={() => onPick(i)}>
                {!isDecode && <img src={s.image} alt="" />}
                <span style={{ display: "grid", gap: 2, minWidth: 0, textAlign: "left" }}>
                  <span style={{ fontFamily: "var(--font-mono)", fontSize: 10.5, letterSpacing: "0.13em", textTransform: "uppercase", color: isDecode ? "var(--bordeaux)" : "var(--ink-3)" }}>{label}</span>
                  {!isDecode && <span style={{ fontFamily: _cjk(title) ? "var(--font-cjk)" : "var(--font-display)", fontSize: 16, color: "var(--ink)", letterSpacing: "0.02em", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{title}</span>}
                </span>
                {isDecode ? <Icon name="arrowR" size={14} /> : <span style={{ fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--ink-3)" }}>{roman(i)}</span>}
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

window.CinemaReader = CinemaReader;

    display:flex;flex-direction:column;box-shadow:-1px 0 0 rgba(0,0,0,.1)}
  .twk-chip>span>i{flex:1;box-shadow:0 -1px 0 rgba(0,0,0,.1)}
  .twk-chip>span>i:first-child{box-shadow:none}
  .twk-chip svg{position:absolute;top:6px;left:6px;width:13px;height:13px;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
`;

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>
  <script type="text/babel">
/* FABLE · CINEMA — app state machine + mount (reader → CinemaReader) */
const { useState: useStateA, useEffect: useEffectA } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "dark",
  "accent": "#cf9f4c",
  "grain": 0.3,
  "heroArt": "bold",
  "settingChips": "illustrated",
  "shelf": "library",
  "dividers": true
}/*EDITMODE-END*/;

function App() {
  const FB = window.FABLE;
  const md = document.getElementById("source-md").textContent.trim();

  const [savedTheme] = useStateA(() => {
    try { return localStorage.getItem("fable-theme") === "light" ? "light" : "dark"; }
    catch { return "dark"; }
  });
  const [t, setTweak] = useTweaks({ ...TWEAK_DEFAULTS, theme: savedTheme });
  const [lang, setLangState] = useStateA(() => {
    try {
      const saved = localStorage.getItem("fable-lang");
      return ["en", "fr", "da", "zh"].includes(saved) ? saved : "en";
    } catch { return "en"; }
  });
  const [screen, setScreen] = useStateA("create"); // create | generate | reader
  const [request, setRequest] = useStateA(null);
  const [generated, setGenerated] = useStateA(null);

  const pages = React.useMemo(() => (
    generated && generated.lang === lang ? generated.pages : FB.buildPages(md, lang)
  ), [generated, lang]);
  const T = FB.ui[lang];

  useEffectA(() => {
    document.documentElement.setAttribute("data-theme", t.theme);
    try { localStorage.setItem("fable-theme", t.theme); } catch {}
  }, [t.theme]);
  useEffectA(() => {
    document.documentElement.style.setProperty("--accent", t.accent);
    document.documentElement.style.setProperty("--grain", String(t.grain));
  }, [t.accent, t.grain]);
  useEffectA(() => {
    try { localStorage.setItem("fable-lang", lang); } catch {}
    document.documentElement.setAttribute("lang", htmlLang(lang));
  }, [lang]);
  useEffectA(() => {
    window.__fableScreen = screen;
    window.dispatchEvent(new CustomEvent("fable:screen", { detail: screen }));
  }, [screen]);

  const setLang = (x) => setLangState(x);
  const theme = t.theme;
  const setTheme = (x) => setTweak("theme", x);
  const viz = { heroArt: t.heroArt, settingChips: t.settingChips, shelf: t.shelf, dividers: t.dividers };
  const shared = { theme, setTheme, lang, setLang, T, viz };

  return (
    <React.Fragment>
      {screen === "create" && (
        <CinemaCreate {...shared}
          onWeave={(req) => { setGenerated(null); setRequest(req); setScreen("generate"); window.scrollTo(0, 0); }}
          onOpenBook={() => { setGenerated(null); setScreen("reader"); window.scrollTo(0, 0); }} />
      )}
      {screen === "generate" && (
        <GenerateScreen {...shared} request={request}
          onDone={(result) => { if (result && result.pages) setGenerated(result); setScreen("reader"); window.scrollTo(0, 0); }} />
      )}
      {screen === "reader" && (
        <CinemaReader {...shared} pages={pages}
          onExit={() => { setScreen("create"); window.scrollTo(0, 0); }} />
      )}

      <TweaksPanel title="Tweaks">
        <TweakSection label="Brand" />
        <TweakColor label="Accent" value={t.accent}
          options={["#cf9f4c", "#c66a64", "#6f9c84", "#46a5b9"]}
          onChange={(v) => setTweak("accent", v)} />
        <TweakRadio label="Theme" value={t.theme} options={["dark", "light"]}
          onChange={(v) => setTweak("theme", v)} />
        <TweakSlider label="Film grain" value={t.grain} min={0} max={1} step={0.1}
          onChange={(v) => setTweak("grain", v)} />

        <TweakSection label="Entry" />
        <TweakSelect label="Hero backdrop" value={t.heroArt}
          options={["off", "subtle", "bold"]}
          onChange={(v) => setTweak("heroArt", v)} />
        <TweakRadio label="Setting picker" value={t.settingChips}
          options={[{ value: "text", label: "Text" }, { value: "illustrated", label: "Illustrated" }]}
          onChange={(v) => setTweak("settingChips", v)} />
        <TweakRadio label="Shelf" value={t.shelf}
          options={[{ value: "single", label: "Single" }, { value: "library", label: "Library" }]}
          onChange={(v) => setTweak("shelf", v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
